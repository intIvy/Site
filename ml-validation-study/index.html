<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16273F">
<title>Ask Ella · ML Validation Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;700&display=swap">
<style>
  :root{
    --ink:#1a1a1a; --ink-mute:#9a9a9a; --rule:#e2e2e2; --off:#f4f4f2; --blue-deep:#4a8fa8;
    --serif:"Cormorant Garamond",Georgia,serif;
    --sans:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:"DM Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--off);line-height:1.55;-webkit-font-smoothing:antialiased}
  h1{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:.01em;font-size:40px;line-height:1.02;margin-top:10px}
  h1 em{font-style:italic;color:var(--blue-deep)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-mute)}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 6vw 80px}
  header.top{border-bottom:1px solid var(--rule);padding-bottom:22px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">Ask Ella</div>
    <h1>ML validation <em>study</em></h1>
  </header>
</div>
</body>
</html>
